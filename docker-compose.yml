services:
  gateway:
    image: ${GATEWAY_IMAGE:-google-workspace-gateway:local}
    restart: unless-stopped
    init: true
    environment:
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:?Ustaw OAUTH_REDIRECT_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Ustaw GOOGLE_CLIENT_ID}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?Ustaw ALLOWED_EMAILS}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      AGENT_TOKEN_FILE: /run/secrets/agent_token
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DB_PATH: /data/gateway.sqlite
      PORT: 8765
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8765}:8765"
    secrets:
      - google_client_secret
      - agent_token
      - encryption_key
    volumes:
      - gateway_data:/data
secrets:
  google_client_secret:
    file: ./secrets/google_client_secret
  agent_token:
    file: ./secrets/agent_token
  encryption_key:
    file: ./secrets/encryption_key
volumes:
  gateway_data:
